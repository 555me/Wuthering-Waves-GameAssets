name: High-Fidelity Deploy Pipeline

on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库最新代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 安装 Linux 官方 WebP 核心压缩工具
    - name: Install WebP Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y webp

    # 3. 核心图像处理层：高保真转为 85% 质量、最高压缩强度（m 6）的 WebP，并采用静音和多线程模式
    - name: Convert PNG to High-Quality WebP
      run: |
        echo "开始高保真图像处理流水线（已启用静音压缩与精简日志）..."
        
        # 统计总文件数
        TOTAL_FILES=$(find . -name "*.png" -type f | wc -l)
        COUNTER=0
        
        echo "本次任务共需转换 $TOTAL_FILES 张图片。"
        
        # 使用 -print0 和 read -d 确保完美兼容带有空格或特殊字符的游戏资产文件名
        while IFS= read -r -d '' img; do
          COUNTER=$((COUNTER + 1))
          
          # 每 500 张图或者到最后一张图时，打印一次进度，防止日志刷屏卡死浏览器
          if [ $((COUNTER % 500)) -eq 0 ] || [ "$COUNTER" -eq "$TOTAL_FILES" ]; then
            echo "[任务进度: $COUNTER / $TOTAL_FILES] 正在高效转换中..."
          fi
          
          # -q 85 控制画质，-m 6 用最大算力压榨体积并优化边缘，-quiet 关闭宏块调试日志
          cwebp -quiet -q 85 -m 6 -mt "$img" -o "${img%.png}.webp"
          rm "$img" # 转换成功后立刻删除原 PNG，释放临时磁盘空间
        done < <(find . -name "*.png" -type f -print0)
        
        echo "所有图像高保真转换完成。"

    # 4. 安全拦截层：计算转换后的纯净体积，超过 18GB 自动拉闸，防止撑爆雨云存储桶
    - name: Check Folder Size Safely
      run: |
        REAL_SIZE_KB=$(du -s --exclude=".git" --exclude=".github" . | awk '{print $1}')
        REAL_SIZE_GB=$(awk "BEGIN {print $REAL_SIZE_KB/1024/1024}")
        
        echo "=============================================="
        echo "转换为 WebP 后，实际需要同步到 RainS3 的总体积为: $REAL_SIZE_GB GB"
        echo "=============================================="
        
        if [ "$REAL_SIZE_KB" -gt 18874368 ]; then
          echo "【安全拦截】WebP 转换后总体积依然超过 18GB 安全线！已自动断电。"
          exit 1
        fi
        echo "体积达标，通过安全检查。"

    # 5. 执行原生 S3 同步（精准排除 Git 隐藏配置文件，不产生冗余流量）
    - name: Sync to RainS3 via Native S3 Protocol
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.SFTP_USERNAME }}     
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SFTP_PASSWORD }} 
        AWS_DEFAULT_REGION: 'cn-nb1'                        
      run: |
        aws s3 sync ./ s3://wutherin --endpoint-url https://cn-nb1.rains3.com --exclude ".git/*" --exclude ".github/*"
